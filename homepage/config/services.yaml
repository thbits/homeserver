---
# For configuration options and examples, please see:
# https://gethomepage.dev/en/configs/services
#
# NOTE: most service cards + widgets come from Docker container labels
# (homepage.* labels on each compose service). Only services that CANNOT
# be label-driven are defined here:
#   - the Calendar widget (needs integrations referencing label services)
#   - Crowdsec (no homepage.* labels on its container)
#   - external links (Notifiarr.com, Homeserver Repo)

- Calendar:
    - ‎:
        widget:
            type: calendar
            firstDayInWeek: Sunday
            showTime: true
            integrations:
                - type: sonarr
                  service_group: Servarr
                  service_name: Sonarr
                - type: radarr
                  service_group: Servarr
                  service_name: Radarr

- Network:
    - Crowdsec:
        icon: crowdsec.png
        href: 'https://crowdsec.{{HOMEPAGE_VAR_DOMAIN_NAME}}/'
        description: Security engine
        widget:
            type: crowdsec
            url: http://crowdsec:8080
            username: localhost
            password: '{{HOMEPAGE_VAR_CROWDSEC_LAPI_PASSWORD}}'

- Other:
    - Notifiarr.com:
        icon: notifiarr.png
        href: https://notifiarr.com/
        description: Service monitoring and Discord alerts website
        ping: https://notifiarr.com/
    - Homeserver Repo:
        icon: github.png
        href: https://github.com/thbits/homeserver
        description: Main repo on github
        ping: https://github.com
