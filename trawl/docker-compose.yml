services:
  trawl-redis:
    container_name: trawl-redis
    image: docker.io/library/redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    command: redis-server --save "" --appendonly no
    environment:
      - TZ=${TIMEZONE}
    restart: unless-stopped
    networks:
      - internal

  trawl:
    container_name: trawl
    image: ghcr.io/germondai/trawl:1.10.1@sha256:043557ba10db0cff79f82ebcfb7e46ca6d83b57324b9f438973fd70d06daa1de
    environment:
      - TZ=${TIMEZONE}
      - REDIS_URL=redis://trawl-redis:6379
      - BROWSER_POOL_SIZE=2
      - SESSION_TTL_SECONDS=3600
    shm_size: 1gb
    depends_on:
      - trawl-redis
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    external: true
