services:
  trawl-redis:
    container_name: trawl-redis
    image: docker.io/library/redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    command: redis-server --save "" --appendonly no
    environment:
      - TZ=${TIMEZONE}
    restart: unless-stopped
    networks:
      - internal

  trawl:
    container_name: trawl
    image: ghcr.io/germondai/trawl:1.8.0@sha256:44091fc0af5f9a0190d4cb23d944f69207684a28382a921800dda5b73b41ba2f
    environment:
      - TZ=${TIMEZONE}
      - REDIS_URL=redis://trawl-redis:6379
      - BROWSER_POOL_SIZE=2
      - SESSION_TTL_SECONDS=3600
    shm_size: 1gb
    depends_on:
      - trawl-redis
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    external: true
