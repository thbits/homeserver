services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
    container_name: recyclarr
    user: 1000:1000
    volumes:
      - ${DATADIR}/recyclarr/config:/config
      - ${CONFIGDIR}/recyclarr/recyclarr.yml:/config/recyclarr.yml
    environment:
      - TZ=${TIMEZONE}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    external: true