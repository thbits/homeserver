services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7@sha256:9c6c74d52cfc6f740a5a3624aa83867e171bb70b90453ddb7a4048b8c80445f9
    container_name: recyclarr
    user: 1000:1000
    volumes:
      - ${DATADIR}/recyclarr/config:/config
      - ${CONFIGDIR}/recyclarr/recyclarr.yml:/config/recyclarr.yml
    environment:
      - TZ=${TIMEZONE}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    external: true