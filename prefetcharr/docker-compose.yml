services:
  prefetcharr:
    image: phueber/prefetcharr:latest@sha256:97eeea177f7e6b2a1a85514cae68d38736bbae21a40bc62696699001d7ed84f7
    container_name: prefetcharr
    volumes:
      # Copy prefetcharr.toml to your ${DATADIR} and set the api keys for jellyfin and sonarr
      - ${DATADIR}/prefetcharr/prefetcharr.toml:/config
      - ${DATADIR}/prefetcharr/log:/log
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    external: true
