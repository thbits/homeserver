services:
  prefetcharr:
    image: phueber/prefetcharr:latest@sha256:01d8de2d1cf40d4979ff14438afd3891282a1ebe807cc5b10268148c0806b4b0
    container_name: prefetcharr
    volumes:
      # Copy prefetcharr.toml to your ${DATADIR} and set the api keys for jellyfin and sonarr
      - ${DATADIR}/prefetcharr/prefetcharr.toml:/config
      - ${DATADIR}/prefetcharr/log:/log
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    external: true
